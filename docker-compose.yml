# =============================================================================
# docker-compose.yml — Carico 3D (produzione)
#
# Servizi: postgres · web (gunicorn) · worker (Django Q2) · nginx
#
# Uso:
#   cp .env.example .env        # poi valorizzare SECRET_KEY, DB_PASSWORD,
#                               # ALLOWED_HOSTS, CSRF_TRUSTED_ORIGINS...
#   docker compose up -d --build
# =============================================================================
name: carico3d

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-carico_3d}
      POSTGRES_USER: ${DB_USER:-carico}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD mancante nel .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-carico} -d ${DB_NAME:-carico_3d}"]
      interval: 5s
      timeout: 5s
      retries: 12

  web:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment: &app_env
      DB_NAME: ${DB_NAME:-carico_3d}
      DB_USER: ${DB_USER:-carico}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD mancante nel .env}
      DB_HOST: postgres
      DB_PORT: "5432"
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY mancante nel .env}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS mancante nel .env}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      CORS_ALLOW_ALL_ORIGINS: ${CORS_ALLOW_ALL_ORIGINS:-False}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-False}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-False}
      CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-False}
      SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-0}
      SECURE_HSTS_INCLUDE_SUBDOMAINS: ${SECURE_HSTS_INCLUDE_SUBDOMAINS:-False}
      SECURE_HSTS_PRELOAD: ${SECURE_HSTS_PRELOAD:-False}
      # Proxy fidati per X-Real-IP (opzionale: vuoto = fidati solo peer privati)
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ICON_CONFIG_PATH: /data/icon_config.json
      ICON_UPLOAD_DIR: /data/img_uploads
      LEMONSQUEEZY_API_KEY: ${LEMONSQUEEZY_API_KEY:-}
      LEMONSQUEEZY_STORE_ID: ${LEMONSQUEEZY_STORE_ID:-}
      LEMONSQUEEZY_WEBHOOK_SECRET: ${LEMONSQUEEZY_WEBHOOK_SECRET:-}
      LEMONSQUEEZY_VARIANT_MENSILE_ID: ${LEMONSQUEEZY_VARIANT_MENSILE_ID:-}
      LEMONSQUEEZY_VARIANT_ANNUALE_ID: ${LEMONSQUEEZY_VARIANT_ANNUALE_ID:-}
    volumes:
      - staticfiles:/app/staticfiles
      - appdata:/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz/', timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *app_env
      SKIP_MIGRATE: "1"
      WORKER_HEARTBEAT_PATH: /data/worker_heartbeat
    command: ["sh", "-c", "python manage.py worker_heartbeat --interval 30 >/tmp/worker-heartbeat.log 2>&1 & exec python manage.py qcluster"]
    healthcheck:
      test: ["CMD-SHELL", "test -f /data/worker_heartbeat && test $$(($$(date +%s) - $$(stat -c %Y /data/worker_heartbeat))) -lt 90"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes:
      - appdata:/data

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles:/static:ro
      - appdata:/data:ro
      # --- TLS (attivare insieme a nginx-https.conf.example) ---
      # Certificati Let's Encrypt (creati da ops/certbot.sh) e webroot ACME.
      # Creare prima sul server: mkdir -p /etc/letsencrypt /var/www/certbot
      # - /etc/letsencrypt:/etc/letsencrypt:ro
      # - /var/www/certbot:/var/www/certbot:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pgdata:
  staticfiles:
  appdata:
