# =============================================================================
# nginx.conf — Carico 3D
# - /static/                 → volumi staticfiles (collectstatic)
# - /static/caricamento/img/ → volume upload icone (PNG admin)  [più specifica]
# - /                        → reverse proxy a gunicorn (servizio web)
#
# TLS: per HTTPS aggiungere il blocco 443 con i certificati (es. certbot:
#   certbot --nginx -d tuodominio.com) oppure inserire i propri certificati.
# =============================================================================
upstream django {
    server web:8000;
}

# Mappa il proto reale: se il client (es. Cloudflare Tunnel) imposta
# X-Forwarded-Proto lo usiamo, altrimenti usiamo $scheme (HTTP diretto).
# Questo è critico per CSRF e redirect quando si usa un tunnel Cloudflare.
map $http_x_forwarded_proto $real_scheme {
    default $scheme;
    https   https;
}

# Rate limit per-IP sul solo endpoint di login/landing (richieste a `/`).
limit_req_zone $binary_remote_addr zone=login_zone:10m rate=5r/s;

server {
    listen 80;
    server_name _;
    server_tokens off;

    # Upload PNG icone (max 500 KB lato app, margine incluso)
    client_max_body_size 2m;

    # ACME challenge per Let's Encrypt (certbot webroot). Serve soltanto per
    # emettere/rinnovare il certificato; è inerte finché non si attiva HTTPS.
    # Per usarlo va montato il volume /var/www/certbot nel servizio nginx
    # (vedi docker-compose.yml) e va creato sul server: mkdir -p /var/www/certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # CSP iniziale in sola osservazione: non blocca le risorse, ma evidenzia
    # script inline e sorgenti esterne da sistemare prima dell'attivazione.
    # La policy finale dovrà rimuovere ogni eventuale unsafe-inline per gli script.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: blob:; font-src 'self' https://cdn.jsdelivr.net; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;

    # Upload icone — volume /data (priorità su /static/ per path più specifico)
    # Cache breve + must-revalidate: gli admin possono ri-caricare un PNG con
    # lo stesso nome (flusso normale della gestione icone) e la modifica deve
    # essere visibile subito — il <img src> non ha query string di versione.
    location /static/caricamento/img/ {
        alias /data/img_uploads/;
        access_log off;
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Static raccolti — volume /static (collectstatic)
    location /static/ {
        alias /static/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Landing + login (POST /): rate limit anti brute-force come seconda barriera
    # oltre a django-axes. burst=10 assorbe i refresh rapidi della landing.
    location = / {
        limit_req zone=login_zone burst=10 nodelay;
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $real_scheme;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $real_scheme;
        proxy_read_timeout 300s;
    }
}
