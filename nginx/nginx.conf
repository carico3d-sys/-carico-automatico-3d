# =============================================================================
# nginx.conf — Carico 3D
# - /static/                 → volumi staticfiles (collectstatic)
# - /static/caricamento/img/ → volume upload icone (PNG admin)  [più specifica]
# - /                        → reverse proxy a gunicorn (servizio web)
#
# TLS: per HTTPS aggiungere il blocco 443 con i certificati (es. certbot:
#   certbot --nginx -d tuodominio.com) oppure inserire i propri certificati.
# =============================================================================
upstream django {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    # Upload PNG icone (max 500 KB lato app, margine incluso)
    client_max_body_size 2m;

    # Upload icone — volume /data (priorità su /static/ per path più specifico)
    # Cache breve + must-revalidate: gli admin possono ri-caricare un PNG con
    # lo stesso nome (flusso normale della gestione icone) e la modifica deve
    # essere visibile subito — il <img src> non ha query string di versione.
    location /static/caricamento/img/ {
        alias /data/img_uploads/;
        access_log off;
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # Static raccolti — volume /static (collectstatic)
    location /static/ {
        alias /static/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
