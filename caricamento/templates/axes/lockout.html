{% load static %}
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accesso temporaneamente bloccato — Carico 3D</title>
    <style>
        body {
            margin: 0; min-height: 100vh; display: flex; align-items: center;
            justify-content: center; font-family: -apple-system, BlinkMacSystemFont,
            'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f0f2f5; color: #333; font-size: 14px;
        }
        .card {
            background: #fff; border: 1px solid #e2e2e2; border-radius: 16px;
            padding: 36px 40px; max-width: 420px; text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.08);
        }
        h1 { font-size: 18px; margin: 0 0 12px; color: #1a1a2e; }
        p { color: #666; line-height: 1.5; margin: 0 0 20px; }
        a {
            display: inline-block; padding: 10px 20px; background: #447e9b;
            color: #fff; text-decoration: none; border-radius: 8px;
            font-weight: 600; font-size: 13px;
        }
        a:hover { background: #3a6d87; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🔒 Troppi tentativi di accesso</h1>
        <p>
            Per la tua sicurezza l'accesso è temporaneamente bloccato a causa
            di troppi tentativi falliti. Riprova tra qualche minuto.
        </p>
        <a href="/">Torna alla pagina di accesso</a>
    </div>
</body>
</html>
