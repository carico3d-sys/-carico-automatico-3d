<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Email inviata — Carico 3D</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f4f8; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: #fff; border-radius: 12px; padding: 36px 32px; max-width: 420px; width: 100%; box-shadow: 0 4px 24px rgba(0,0,0,0.08); text-align: center; }
        .icon { font-size: 48px; margin-bottom: 12px; }
        h2 { color: #333; margin-bottom: 8px; }
        p { color: #666; font-size: 14px; line-height: 1.5; margin-bottom: 20px; }
        .btn { display: inline-block; padding: 10px 24px; background: #069; color: #fff; text-decoration: none; border-radius: 6px; font-size: 14px; font-weight: 600; }
        .btn:hover { background: #057; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">✅</div>
        <h2>Email inviata!</h2>
        <p>Se esiste un account con l'email inserita, riceverai a breve le istruzioni per reimpostare la password.</p>
        <p style="font-size:13px;color:#999;">Controlla anche la cartella spam.</p>
        <a href="/" class="btn">← Torna al login</a>
    </div>
</body>
</html>
