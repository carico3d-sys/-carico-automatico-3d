<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Password dimenticata — Carico 3D</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f4f8; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: #fff; border-radius: 12px; padding: 36px 32px; max-width: 420px; width: 100%; box-shadow: 0 4px 24px rgba(0,0,0,0.08); text-align: center; }
        .logo { font-size: 36px; margin-bottom: 8px; }
        h2 { color: #333; margin-bottom: 6px; }
        .subtitle { color: #666; font-size: 14px; margin-bottom: 24px; }
        label { display: block; text-align: left; font-size: 13px; color: #555; margin-bottom: 4px; font-weight: 600; }
        input[type="email"] { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; margin-bottom: 20px; }
        input[type="email"]:focus { outline: none; border-color: #069; }
        .btn { width: 100%; padding: 12px; background: #069; color: #fff; border: none; border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer; }
        .btn:hover { background: #057; }
        .back { display: block; margin-top: 16px; color: #069; text-decoration: none; font-size: 13px; }
        .back:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">📦</div>
        <h2>Password dimenticata?</h2>
        <p class="subtitle">Inserisci la tua email e ti invieremo le istruzioni per reimpostare la password.</p>
        <form method="post">
            {% csrf_token %}
            <label for="id_email">Email</label>
            <input type="email" name="email" id="id_email" placeholder="la-tua@email.com" required autofocus>
            <button type="submit" class="btn">📧 Invia link di reset</button>
        </form>
        <a href="/" class="back">← Torna al login</a>
    </div>
</body>
</html>
