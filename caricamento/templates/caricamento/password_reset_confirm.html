<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nuova password — Carico 3D</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f4f8; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: #fff; border-radius: 12px; padding: 36px 32px; max-width: 420px; width: 100%; box-shadow: 0 4px 24px rgba(0,0,0,0.08); text-align: center; }
        .logo { font-size: 36px; margin-bottom: 8px; }
        h2 { color: #333; margin-bottom: 6px; }
        .subtitle { color: #666; font-size: 14px; margin-bottom: 24px; }
        label { display: block; text-align: left; font-size: 13px; color: #555; margin-bottom: 4px; font-weight: 600; }
        input[type="password"] { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; margin-bottom: 16px; }
        input[type="password"]:focus { outline: none; border-color: #069; }
        .btn { width: 100%; padding: 12px; background: #069; color: #fff; border: none; border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer; }
        .btn:hover { background: #057; }
        .error { color: #c33; font-size: 13px; margin-bottom: 12px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">🔑</div>
        <h2>Imposta nuova password</h2>
        <p class="subtitle">Scegli una password sicura per il tuo account.</p>
        {% if validlink %}
        <form method="post">
            {% csrf_token %}
            <label for="id_new_password1">Nuova password</label>
            <input type="password" name="new_password1" id="id_new_password1" required autofocus>
            <label for="id_new_password2">Conferma password</label>
            <input type="password" name="new_password2" id="id_new_password2" required>
            <button type="submit" class="btn">💾 Salva nuova password</button>
        </form>
        {% else %}
        <p class="error">❌ Il link di reset non è valido o è scaduto.<br>Richiedine uno nuovo.</p>
        <a href="/password-reset/" class="btn" style="display:inline-block;margin-top:12px;">Richiedi nuovo link</a>
        {% endif %}
    </div>
</body>
</html>
