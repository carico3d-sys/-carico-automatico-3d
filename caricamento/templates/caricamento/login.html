{% load static %}
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="{% static 'caricamento/img/icons8-3d-64.png' %}">
    <title>Accesso — Carico 3D</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', -apple-system, Arial, sans-serif;
            background: linear-gradient(135deg, #0d0d1a 0%, #1a1a3e 50%, #0d0d1a 100%);
            color: #e0e0f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(68, 136, 255, 0.15);
            border-radius: 20px;
            padding: 40px 32px 32px;
            backdrop-filter: blur(10px);
        }

        .login-logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-logo .logo-icon {
            font-size: 48px;
            display: block;
            margin-bottom: 8px;
        }

        .login-logo h1 {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, #4488ff, #66aaff, #88ccff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .login-logo p {
            font-size: 14px;
            color: #8888aa;
            margin-top: 4px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #aaaacc;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(68, 136, 255, 0.12);
            border-radius: 10px;
            color: #e0e0f0;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .form-group input:focus {
            border-color: #4488ff;
            box-shadow: 0 0 0 3px rgba(68, 136, 255, 0.15);
        }

        .form-group input::placeholder {
            color: #555577;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #4488ff, #3366dd);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-submit:hover {
            background: linear-gradient(135deg, #5599ff, #4477ee);
            transform: translateY(-1px);
            box-shadow: 0 4px 20px rgba(68, 136, 255, 0.3);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .error-message {
            background: rgba(255, 68, 68, 0.1);
            border: 1px solid rgba(255, 68, 68, 0.3);
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 20px;
            color: #ff6666;
            font-size: 14px;
            text-align: center;
        }

        .login-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 13px;
            color: #555577;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-logo">
                <span class="logo-icon">📦</span>
                <h1>Carico 3D</h1>
                <p>Ottimizzazione del carico tridimensionale</p>
            </div>

            {% if form.errors %}
            <div class="error-message">
                ❌ Credenziali non valide. Riprova.
            </div>
            {% endif %}

            <form method="post" action="{% url 'caricamento:login' %}">
                {% csrf_token %}
                <div class="form-group">
                    <label for="id_username">Username</label>
                    <input type="text" name="username" id="id_username" placeholder="Inserisci username" autofocus required>
                </div>
                <div class="form-group">
                    <label for="id_password">Password</label>
                    <input type="password" name="password" id="id_password" placeholder="Inserisci password" required>
                </div>
                <button type="submit" class="btn-submit">Accedi</button>
            </form>

            <div class="login-footer">
                Carico Tridimensionale &mdash; 3D Bin Packing Optimizer
            </div>
        </div>
    </div>
</body>
</html>
