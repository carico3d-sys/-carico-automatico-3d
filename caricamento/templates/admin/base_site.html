{% extends "admin/base.html" %}
{% load static %}

{% block title %}{% if subtitle %}{{ subtitle }} | {% endif %}{{ title }} | Carico 3D Admin{% endblock %}

{% block branding %}
<div id="site-name" style="display:flex;align-items:center;gap:12px;">
    <a href="{% url 'admin:index' %}" style="font-size:18px;font-weight:700;color:#fff;text-decoration:none;">
        📦 Carico 3D
    </a>
    <span style="color:#7777aa;font-size:12px;font-weight:400;">Admin</span>
</div>
{% endblock %}

{% block nav-global %}
<div style="display:flex;align-items:center;gap:8px;margin-right:16px;">
    <a href="/workspace/"
       style="display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:8px;
              background:rgba(68,136,255,0.12);color:#4488ff;text-decoration:none;font-size:13px;font-weight:600;
              transition:all 0.2s ease;"
       onmouseover="this.style.background='rgba(68,136,255,0.2)'"
       onmouseout="this.style.background='rgba(68,136,255,0.12)'">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/>
        </svg>
        Workspace
    </a>
</div>
{% endblock %}
